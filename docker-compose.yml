services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playsense
      POSTGRES_USER: playsense
      POSTGRES_PASSWORD: playsense
    ports:
      - "5432:5432"
    volumes:
      - playsense-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playsense"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/playsense
      COOKIE_SECURE: "false"
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      db:
        condition: service_healthy

volumes:
  playsense-db:
